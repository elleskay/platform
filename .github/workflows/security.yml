name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

# Default: read-only. Jobs that need more declare it themselves.
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    # Runs on pull requests and the weekly schedule. Skipped on direct pushes to
    # main, since a merged PR was already scanned; avoids a redundant second run.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Advisory, not blocking: unfixable transitive advisories should not hold
      # the template red, but every lockfile in the repo gets scanned.
      - name: Audit workspace lockfile
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Audit CDK template lockfile
        working-directory: infra/cdk/_template
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Audit CDK setup lockfile
        working-directory: infra/cdk/_setup
        run: npm audit --audit-level=high
        continue-on-error: true
