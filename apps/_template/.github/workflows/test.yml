name: Test (spec-driven)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

# pull-requests: write is required by the coverage-comment step below.
permissions:
  contents: read
  pull-requests: write

jobs:
  spec:
    name: Spec coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://test:test@localhost:5432/test
      AUTH_SECRET: ci-test-secret-not-used-in-prod
      AUTH_URL: http://localhost:3000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build @platform/spec-test (dist is gitignored)
        working-directory: packages/spec-test
        run: npm run build
      - name: Resolve Playwright version
        id: pw
        working-directory: apps/web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: nextjs-web-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/web/**/*.[jt]s', 'apps/web/**/*.[jt]sx') }}
          restore-keys: |
            nextjs-web-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: Apply DB migrations
        working-directory: apps/web
        run: npm run db:migrate
      - name: Seed test data
        working-directory: apps/web
        run: npm run db:seed
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Lint (includes spec-test/require-expect-in-spec-test rule)
        working-directory: apps/web
        run: npm run lint
      - name: Build app
        working-directory: apps/web
        run: npm run build
      - name: Run unit specs
        working-directory: apps/web
        run: npm run test:unit
      - name: Run e2e specs
        working-directory: apps/web
        run: npm run test:e2e
      - name: Spec coverage gate (fails if <100%)
        working-directory: apps/web
        run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spec-coverage
          path: apps/web/spec-coverage.md
          if-no-files-found: warn
      # Upsert a single coverage comment per PR instead of stacking a new one
      # on every push.
      - name: Comment coverage on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'apps/web/spec-coverage.md';
            if (!fs.existsSync(path)) return;
            const marker = '<!-- spec-coverage-report -->';
            const body = marker + '\n' + fs.readFileSync(path, 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && (c.body || '').startsWith(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
